name: Daily Edition Generator

on:
  schedule:
    - cron: '0 16 * * *'  # 9am PDT (UTC-7); change to 0 17 * * * in winter (PST/UTC-8)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: node scripts/generate-edition.js

      - name: Read edition slug
        id: slug
        run: |
          if [ -f /tmp/edition-slug.txt ]; then
            echo "slug=$(cat /tmp/edition-slug.txt)" >> $GITHUB_OUTPUT
          else
            echo "slug=" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push new edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/editions/
          git diff --staged --quiet || git commit -m "chore: add daily edition $(date -u +%Y-%m-%d)"
          git stash
          git pull --rebase origin main
          git stash pop
          git push origin main

      - name: Trigger Instagram generation
        if: steps.slug.outputs.slug != ''
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.PERSONAL_ACCESS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d "{\"event_type\":\"edition_published\",\"client_payload\":{\"edition_url\":\"https://www.aidaily.now/editions/${{ steps.slug.outputs.slug }}\"}}"
